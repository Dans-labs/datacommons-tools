name: CI/CD

on:
  release:
    types: [published]

env:
  APP_NAME: datacommons-tools-ui

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - name: Parse tag
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^(demo|prod)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ENV="${BASH_REMATCH[1]}"
            echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid tag format. Expected: (demo|prod)-vX.Y.Z  Got: $TAG"
            exit 1
          fi

  deploy:
    name: Deploy → ${{ needs.validate.outputs.environment }}
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ vars.SERVER_APP_DIR }}

            git fetch --tags
            git checkout ${{ github.event.release.tag_name }}

            docker build \
              --build-arg VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY }} \
              --build-arg VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }} \
              --build-arg VITE_TOOLS_API=${{ vars.VITE_TOOLS_API }} \
              -t ${{ env.APP_NAME }} .

            docker stop ${{ env.APP_NAME }} || true
            docker rm ${{ env.APP_NAME }} || true
            docker run -d --name ${{ env.APP_NAME }} -p ${{ vars.SERVER_APP_PORT }}:80 ${{ env.APP_NAME }}

            sleep 5
            STATUS=$(docker inspect --format='{{.State.Status}}' ${{ env.APP_NAME }})
            if [[ "$STATUS" != "running" ]]; then
              echo "::error::Container is not running after deploy (state: $STATUS)"
              exit 1
            fi
