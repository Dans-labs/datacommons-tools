name: CI/CD

on:
  release:
    types: [published]

env:
  APP_NAME: datacommons-tools-ui

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - name: Parse tag
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^(demo|prod)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ENV="${BASH_REMATCH[1]}"
            echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid tag format. Expected: (demo|prod)-vX.Y.Z  Got: $TAG"
            exit 1
          fi

  deploy:
    name: Deploy → ${{ needs.validate.outputs.environment }}
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SERVER_APP_DIR }}
            cd datacommons-tools
            git fetch --tags --force
            git checkout -f ${{ github.event.release.tag_name }}
            cd ..
            # VITE_TOOLS_API is a build arg, runtime vars go in environment
            VITE_TOOLS_API="${{ vars.VITE_TOOLS_API }}" \
            OIDC_ISSUER_URI="${{ vars.OIDC_ISSUER_URI }}" \
            OIDC_CLIENT_ID="${{ vars.OIDC_CLIENT_ID }}" \
            TOOLS_API="${{ vars.TOOLS_API }}" \
            docker compose up -d --build --remove-orphans frontend
            sleep 5
            STATUS=$(docker inspect --format='{{.State.Status}}' frontend)
            if [[ "$STATUS" != "running" ]]; then
              echo "::error::Container is not running after deploy (state: $STATUS)"
              docker logs frontend
              exit 1
            fi
